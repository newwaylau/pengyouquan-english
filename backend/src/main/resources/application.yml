spring:
  application:
    name: pengyouquan-english

  # 默认使用 sit profile
  profiles:
    active: sit

  # 数据源配置
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver

  # JPA 配置(仅用于自动建表验证,实际用 Flyway 管理)
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          batch_size: 20

  # Flyway 配置
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  # Redis 配置
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 2000ms
  mail:
    host: smtp.163.com
    port: 465
    username: newwaylau@163.com
    password: REMOVED
    properties:
      mail.smtp.auth: true
      mail.smtp.ssl.enable: true


# Actuator 健康检查
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized
  info:
    env:
      enabled: true

# JWT 配置
jwt:
  secret: REMOVED
  expiration: 86400000  # 24小时,单位毫秒

# 微信小程序配置(需要从小程序后台获取)
wechat:
  app-id:
  app-secret:

# 日志配置
logging:
  level:
    com.pengyouquan.english: DEBUG
    org.springframework: INFO
    org.hibernate: WARN
