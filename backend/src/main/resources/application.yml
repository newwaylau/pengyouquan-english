server:
  port: 8080

spring:
  application:
    name: pengyouquan-english

  # 数据源配置
  datasource:
    url: jdbc:mysql://localhost:3306/pengyouquan_english?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&characterEncoding=UTF-8
    username: root
    password: REMOVED
    driver-class-name: com.mysql.cj.jdbc.Driver

  # JPA 配置（仅用于自动建表验证，实际用 Flyway 管理）
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          batch_size: 20

  # Flyway 配置
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  # Redis 配置
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 2000ms

  # 文件上传限制
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB

# JWT 配置
jwt:
  secret: REMOVED
  expiration: 86400000  # 24小时，单位毫秒

# 微信小程序配置（需要从小程序后台获取）
wechat:
  app-id:
  app-secret:

# 日志配置
logging:
  level:
    com.pengyouquan.english: DEBUG
    org.springframework: INFO
    org.hibernate: WARN
