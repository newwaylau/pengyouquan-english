<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>英语剧场 · 设计提案</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  -webkit-font-smoothing: antialiased;
  background: #0a0f1e;
  color: #e2e8f0;
  line-height: 1.5;
}
/* Background effect */
.bg-glow {
  position: fixed; inset: 0; overflow: hidden; pointer-events: none; z-index: 0;
}
.bg-glow::before {
  content: ''; position: absolute; width: 600px; height: 600px;
  background: radial-gradient(circle, rgba(20,184,166,0.08), transparent 70%);
  top: -200px; right: -200px;
}
.bg-glow::after {
  content: ''; position: absolute; width: 400px; height: 400px;
  background: radial-gradient(circle, rgba(20,184,166,0.05), transparent 70%);
  bottom: -100px; left: -100px;
}
.app { position: relative; z-index: 1; display: flex; min-height: 100vh; }
/* Sidebar - compact glass */
.sidebar {
  width: 72px; background: rgba(30,41,59,0.6); backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border-right: 1px solid rgba(51,65,85,0.3);
  display: flex; flex-direction: column; align-items: center;
  padding: 20px 0; flex-shrink: 0;
}
.logo-icon {
  width: 40px; height: 40px;
  background: linear-gradient(135deg, #14b8a6, #0d9488);
  border-radius: 12px; display: flex; align-items: center; justify-content: center;
  font-size: 20px; cursor: pointer; margin-bottom: 24px;
  box-shadow: 0 4px 12px rgba(20,184,166,0.3);
}
.nav-icon-item {
  width: 44px; height: 44px; border-radius: 12px;
  display: flex; align-items: center; justify-content: center;
  font-size: 18px; cursor: pointer; transition: all 0.15s;
  border: none; background: transparent; color: #64748b; margin-bottom: 4px;
  position: relative;
}
.nav-icon-item:hover { background: rgba(51,65,85,0.5); color: #e2e8f0; }
.nav-icon-item.active {
  background: rgba(20,184,166,0.15); color: #14b8a6;
}
.nav-icon-item.active::before {
  content: ''; position: absolute; left: -12px; top: 50%; transform: translateY(-50%);
  width: 3px; height: 20px; background: #14b8a6; border-radius: 0 4px 4px 0;
}
.nav-icon-item .badge {
  position: absolute; top: 2px; right: 2px;
  background: #ef4444; color: #fff; font-size: 9px;
  min-width: 16px; height: 16px; border-radius: 8px;
  display: flex; align-items: center; justify-content: center;
  font-weight: 700; padding: 0 4px;
}
.sidebar-spacer { flex: 1; }
.avatar-sm {
  width: 36px; height: 36px; border-radius: 10px;
  background: linear-gradient(135deg, #6366f1, #14b8a6);
  display: flex; align-items: center; justify-content: center;
  font-size: 14px; font-weight: 600; color: #fff; cursor: pointer;
}
/* Main */
.main { flex: 1; display: flex; flex-direction: column; }
.topbar {
  padding: 16px 32px; display: flex; align-items: center; justify-content: space-between;
  border-bottom: 1px solid rgba(51,65,85,0.3);
}
.search-bar {
  display: flex; align-items: center; gap: 8px;
  background: rgba(30,41,59,0.5); border: 1px solid rgba(51,65,85,0.3);
  border-radius: 8px; padding: 8px 14px; width: 280px;
}
.search-bar input {
  border: none; background: transparent; color: #e2e8f0; font-size: 13px;
  font-family: inherit; outline: none; width: 100%;
}
.search-bar input::placeholder { color: #475569; }
.search-bar span { color: #64748b; font-size: 14px; }
.topbar-right { display: flex; align-items: center; gap: 12px; }
.btn-primary {
  padding: 8px 20px; border-radius: 8px; border: none;
  background: linear-gradient(135deg, #14b8a6, #0d9488);
  color: #fff; font-size: 13px; font-weight: 600;
  cursor: pointer; transition: all 0.2s; font-family: inherit;
  box-shadow: 0 2px 8px rgba(20,184,166,0.3);
}
.btn-primary:hover { transform: translateY(-1px); box-shadow: 0 4px 12px rgba(20,184,166,0.4); }
/* Content */
.content { padding: 24px 32px; flex: 1; max-width: 960px; }
.page-title { font-size: 24px; font-weight: 700; color: #f1f5f9; }
.page-subtitle { font-size: 13px; color: #64748b; margin-top: 2px; margin-bottom: 24px; }
/* Glass card */
.glass-card {
  background: rgba(30,41,59,0.4); backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border: 1px solid rgba(51,65,85,0.3);
  border-radius: 16px; padding: 28px;
}
.card-row { display: flex; gap: 24px; align-items: flex-start; }
.card-left { flex: 1; }
.card-right { width: 200px; }
.episode-tag {
  display: inline-flex; align-items: center; gap: 6px;
  font-size: 12px; color: #94a3b8; margin-bottom: 16px;
}
.episode-dot { width: 6px; height: 6px; border-radius: 50%; background: #14b8a6; }
.sentence-en {
  font-size: 24px; font-weight: 600; color: #f1f5f9; line-height: 1.4; margin-bottom: 10px;
}
.sentence-cn { font-size: 15px; color: #64748b; margin-bottom: 24px; }
/* Progress bar */
.progress-bar {
  display: flex; gap: 3px; margin-bottom: 20px;
}
.progress-seg {
  height: 4px; border-radius: 2px; flex: 1;
  background: rgba(51,65,85,0.5);
}
.progress-seg.done { background: #22c55e; }
.progress-seg.current { background: #14b8a6; }
.progress-seg.wrong { background: #ef4444; }
.progress-count { font-size: 12px; color: #64748b; margin-bottom: 16px; }
/* Chips */
.chip {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 6px 14px; border-radius: 20px; font-size: 13px; font-weight: 500;
  border: 1px solid rgba(51,65,85,0.3); background: rgba(30,41,59,0.4);
  color: #94a3b8; cursor: pointer; transition: all 0.15s; font-family: inherit;
}
.chip:hover { background: rgba(51,65,85,0.4); color: #e2e8f0; }
.chip.active { background: rgba(20,184,166,0.15); border-color: #14b8a6; color: #14b8a6; }
.chip-row { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 20px; }
/* Word boxes */
.word-row { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 24px; }
.word-box {
  padding: 10px 14px; border-radius: 8px;
  border: 1px solid rgba(51,65,85,0.3); background: rgba(15,23,42,0.5);
  color: #94a3b8; font-size: 15px; text-align: center; min-width: 40px;
  font-family: inherit; outline: none; transition: all 0.15s;
}
.word-box:focus { border-color: #14b8a6; box-shadow: 0 0 0 2px rgba(20,184,166,0.2); color: #e2e8f0; }
.word-box.done { border-color: #22c55e; color: #22c55e; background: rgba(34,197,94,0.08); }
.word-box.prefill { border-color: transparent; color: #64748b; font-style: italic; }
/* Sidebar right */
.card-right h4 { font-size: 12px; font-weight: 600; color: #64748b; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 12px; }
.stat-block { margin-bottom: 16px; }
.stat-block-label { font-size: 12px; color: #64748b; }
.stat-block-value { font-size: 28px; font-weight: 700; color: #14b8a6; }
.stat-block-sub { font-size: 11px; color: #475569; }
/* Controls in right panel */
.control-group { margin-bottom: 16px; }
.control-label { font-size: 11px; font-weight: 600; color: #64748b; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 6px; }
.speed-row { display: flex; gap: 4px; }
.speed-btn {
  flex: 1; padding: 6px 0; text-align: center; font-size: 12px; font-weight: 500;
  border-radius: 6px; border: 1px solid rgba(51,65,85,0.3);
  background: transparent; color: #64748b; cursor: pointer; font-family: inherit; transition: all 0.1s;
}
.speed-btn:hover { background: rgba(51,65,85,0.3); color: #e2e8f0; }
.speed-btn.active { background: #14b8a6; border-color: #14b8a6; color: #fff; }
/* Login page */
.login-wrapper {
  min-height: 100vh; display: flex; align-items: center; justify-content: center;
  background: #0a0f1e; padding: 20px;
  position: relative;
}
.login-glass {
  background: rgba(30,41,59,0.4); backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border: 1px solid rgba(51,65,85,0.3);
  border-radius: 20px; padding: 48px; width: 420px; max-width: 100%;
  position: relative; overflow: hidden;
}
.login-glass::before {
  content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px;
  background: linear-gradient(90deg, transparent, #14b8a6, transparent);
}
.login-glass h1 { font-size: 28px; font-weight: 700; color: #f1f5f9; text-align: center; margin-bottom: 4px; }
.login-glass p { font-size: 14px; color: #64748b; text-align: center; margin-bottom: 32px; }
.login-field { margin-bottom: 16px; }
.login-field label { display: block; font-size: 12px; font-weight: 500; color: #64748b; margin-bottom: 6px; }
.login-field input {
  width: 100%; padding: 12px 16px; border-radius: 10px;
  border: 1px solid rgba(51,65,85,0.3); background: rgba(15,23,42,0.5);
  color: #e2e8f0; font-size: 14px; font-family: inherit; outline: none;
  transition: all 0.15s;
}
.login-field input:focus { border-color: #14b8a6; box-shadow: 0 0 0 3px rgba(20,184,166,0.15); }
.login-submit {
  width: 100%; padding: 12px; border-radius: 10px; border: none;
  background: linear-gradient(135deg, #14b8a6, #0d9488);
  color: #fff; font-size: 15px; font-weight: 600; cursor: pointer;
  font-family: inherit; transition: all 0.2s; margin-top: 8px;
}
.login-submit:hover { transform: translateY(-1px); box-shadow: 0 4px 16px rgba(20,184,166,0.3); }
.login-links { text-align: center; margin-top: 20px; font-size: 13px; }
.login-links a { color: #64748b; text-decoration: none; cursor: pointer; margin: 0 8px; }
.login-links a:hover { color: #14b8a6; }
@media (max-width: 768px) {
  .sidebar { width: 56px; }
  .content { padding: 16px; }
  .card-row { flex-direction: column; }
  .card-right { width: 100%; }
  .topbar { padding: 12px 16px; }
  .search-bar { width: 180px; }
}
</style>
</head>
<body>

<div style="padding:20px;background:#0a0f1e;border-bottom:1px solid rgba(51,65,85,0.3);">
  <span style="color:#14b8a6;font-size:13px;font-weight:600;">变体 2 · Glassmorphism</span>
  <span style="color:#64748b;font-size:12px;margin-left:12px;">灵感：毛玻璃效果 + 紧凑侧栏 + 右侧面板</span>
</div>

<div class="app">
  <div class="bg-glow"></div>
  <!-- Compact Icon Sidebar -->
  <aside class="sidebar">
    <div class="logo-icon">🎬</div>
    <button class="nav-icon-item active">📝</button>
    <button class="nav-icon-item">❌<span class="badge">12</span></button>
    <button class="nav-icon-item">🔍</button>
    <button class="nav-icon-item">📂</button>
    <button class="nav-icon-item">🧪</button>
    <button class="nav-icon-item">⚙️</button>
    <div class="sidebar-spacer"></div>
    <div class="avatar-sm">H</div>
  </aside>

  <div class="main">
    <header class="topbar">
      <div>
        <div class="page-title" style="font-size:18px;">练习</div>
      </div>
      <div class="topbar-right">
        <div class="search-bar">
          <span>🔍</span>
          <input placeholder="搜索句子...">
        </div>
        <button class="btn-primary">登录</button>
      </div>
    </header>

    <div class="content">
      <div class="page-title">Game of Thrones · S01E02</div>
      <div class="page-subtitle">句子 #1955 · 共 42 句</div>

      <div class="glass-card">
        <div class="card-row">
          <div class="card-left">
            <div class="episode-tag"><span class="episode-dot"></span> 听写模式</div>

            <!-- Progress -->
            <div class="progress-bar">
              <div class="progress-seg done"></div>
              <div class="progress-seg done"></div>
              <div class="progress-seg done"></div>
              <div class="progress-seg current"></div>
              <div class="progress-seg"></div>
              <div class="progress-seg"></div>
              <div class="progress-seg"></div>
              <div class="progress-seg"></div>
              <div class="progress-seg"></div>
              <div class="progress-seg"></div>
            </div>
            <div class="progress-count">3 / 42 句完成</div>

            <div class="sentence-en">Stay here. I'll go back to the inn and bring help.</div>
            <div class="sentence-cn">躺着别动，我这就回旅店找人来帮忙。</div>

            <!-- Mode chips -->
            <div class="chip-row">
              <button class="chip active">🎧 听写</button>
              <button class="chip">🔄 中译英</button>
              <button class="chip">❌ 错题复习</button>
            </div>

            <div class="word-row">
              <div class="word-box done">Stay</div>
              <div class="word-box" contenteditable>here</div>
              <div class="word-box prefill">I'll</div>
              <div class="word-box" contenteditable></div>
              <div class="word-box prefill">back</div>
              <div class="word-box" contenteditable></div>
              <div class="word-box" contenteditable></div>
              <div class="word-box" contenteditable></div>
              <div class="word-box" contenteditable></div>
              <div class="word-box" contenteditable></div>
            </div>

            <div class="chip-row">
              <button class="chip" style="background:#14b8a6;color:#fff;border-color:#14b8a6;font-weight:600;">⏎ 提交</button>
              <button class="chip">🎬 原音</button>
              <button class="chip">🎙️ Ryan</button>
              <button class="chip">⏭️ 下一句</button>
            </div>
          </div>

          <div class="card-right">
            <h4>统计</h4>
            <div class="stat-block">
              <div class="stat-block-value">87%</div>
              <div class="stat-block-label">正确率</div>
              <div class="stat-block-sub">最近 50 句</div>
            </div>
            <div class="stat-block">
              <div class="stat-block-value" style="color:#f1f5f9;">12</div>
              <div class="stat-block-label">待复习错题</div>
            </div>

            <h4 style="margin-top:24px;">语速</h4>
            <div class="control-group">
              <div class="speed-row">
                <button class="speed-btn">0.5×</button>
                <button class="speed-btn">0.75×</button>
                <button class="speed-btn active">1×</button>
                <button class="speed-btn">1.5×</button>
              </div>
            </div>

            <h4>音色</h4>
            <div class="control-group">
              <button class="chip" style="width:100%;justify-content:center;">🎬 剧集原音</button>
              <button class="chip" style="width:100%;justify-content:center;margin-top:4px;">🎙️ Ryan</button>
            </div>

            <div style="margin-top:16px;padding-top:16px;border-top:1px solid rgba(51,65,85,0.3);">
              <button class="chip" style="width:100%;justify-content:center;">👁️ 显示中文翻译</button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Login Page -->
<div style="padding:20px;background:#0a0f1e;border-top:1px solid rgba(51,65,85,0.3);border-bottom:1px solid rgba(51,65,85,0.3);">
  <span style="color:#14b8a6;font-size:13px;font-weight:600;">登录页预览</span>
</div>

<div class="login-wrapper">
  <div class="bg-glow"></div>
  <div class="login-glass">
    <div style="text-align:center;font-size:48px;margin-bottom:8px;">🎬</div>
    <h1>英语剧场</h1>
    <p>登录以继续学习</p>
    <div class="login-field">
      <label>邮箱 / 手机号</label>
      <input type="email" placeholder="newwaylau@hotmail.com" value="newwaylau@hotmail.com">
    </div>
    <div class="login-field">
      <label>密码</label>
      <input type="password" placeholder="••••••••">
    </div>
    <button class="login-submit">登录</button>
    <div class="login-links">
      <a>忘记密码</a> · <a>注册账号</a>
    </div>
  </div>
</div>

</body>
</html>
