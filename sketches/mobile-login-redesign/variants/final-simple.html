<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>英语剧场 — 登录</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@0,400;0,500;1,400;1,500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#060a14;font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}

.phone{width:375px;max-width:100%;background:#0a0e1a;border-radius:32px;overflow:hidden;box-shadow:0 0 0 1px rgba(255,255,255,.06),0 12px 48px rgba(0,0,0,.6)}
.notch{width:126px;height:26px;background:#000;border-radius:0 0 18px 18px;margin:0 auto}
.status{display:flex;justify-content:space-between;padding:8px 24px 0;font-size:.7rem;color:rgba(255,255,255,.35);font-weight:500}

.screen{min-height:740px;display:flex;flex-direction:column;padding:0 24px 24px;position:relative;overflow:hidden;
  background:
    radial-gradient(ellipse 160% 50% at 50% -40%,rgba(20,184,166,.07) 0%,transparent 70%),
    radial-gradient(ellipse 100% 40% at 70% 130%,rgba(20,184,166,.03) 0%,transparent 60%),
    linear-gradient(180deg,#070b18 0%,#0d1225 100%)
}

/* ── brand bar ── */
.brand{display:flex;align-items:center;gap:10px;padding:16px 0 36px}
.brand .mark{width:32px;height:32px;border-radius:8px;background:#14b8a6;display:flex;align-items:center;justify-content:center;font-size:.8rem;font-weight:700;color:#0a0e1a}
.brand .name{font-size:.85rem;font-weight:600;color:rgba(255,255,255,.7)}
.brand .flex{flex:1}
.brand .skip{font-family:'Inter',sans-serif;font-size:.65rem;color:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.03);border-radius:6px;padding:5px 10px;background:transparent;cursor:pointer;transition:all .15s}
.brand .skip:hover{color:rgba(255,255,255,.2);border-color:rgba(255,255,255,.08)}

/* ── hero area ── */
.hero{text-align:center;margin-bottom:28px}
.hero h1{font-size:1.5rem;font-weight:800;color:#fff;letter-spacing:-.03em;line-height:1.2;margin-bottom:6px}
.hero .tagline{font-size:.8rem;color:rgba(255,255,255,.3);line-height:1.5;margin-bottom:20px}

/* ── quote ── */
.quote{background:rgba(255,255,255,.015);border:1px solid rgba(255,255,255,.04);border-radius:14px;padding:20px;margin-bottom:24px;position:relative}
.quote::before{content:'';position:absolute;top:0;left:20px;right:20px;height:1px;background:linear-gradient(90deg,transparent,rgba(20,184,166,.2),transparent)}
.quote blockquote{font-family:'Playfair Display',Georgia,serif;font-size:1.1rem;font-style:italic;font-weight:400;color:rgba(255,255,255,.55);line-height:1.6;margin-bottom:8px;letter-spacing:.005em}
.quote .cite{font-size:.65rem;color:rgba(255,255,255,.15)}
.quote .cite em{font-style:normal;color:#14b8a6;font-weight:400}

/* ── stats ── */
.stats{display:flex;justify-content:center;gap:32px;margin-bottom:36px}
.stats .item{text-align:center}
.stats .item .num{font-size:1.1rem;font-weight:700;color:rgba(255,255,255,.85);letter-spacing:-.01em}
.stats .item .lbl{font-size:.6rem;color:rgba(255,255,255,.12);text-transform:uppercase;letter-spacing:.08em;margin-top:3px}

/* ── form ── */
.field{margin-bottom:12px}
.field label{font-size:.6rem;font-weight:600;color:rgba(255,255,255,.15);text-transform:uppercase;letter-spacing:.08em;margin-bottom:5px;display:block}
.input-wrap{position:relative}
.input-wrap .ico{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:rgba(255,255,255,.1);pointer-events:none;display:flex}
.input-wrap input{width:100%;padding:13px 40px 13px 42px;border-radius:10px;border:1px solid rgba(255,255,255,.06);background:rgba(255,255,255,.03);color:rgba(255,255,255,.9);font-size:.875rem;font-family:'Inter',sans-serif;outline:none;transition:all .15s;-webkit-appearance:none}
.input-wrap input:focus{border-color:rgba(20,184,166,.25);background:rgba(255,255,255,.05)}
.input-wrap input::placeholder{color:rgba(255,255,255,.1)}
.input-wrap .eye{position:absolute;right:8px;top:50%;transform:translateY(-50%);background:none;border:none;color:rgba(255,255,255,.1);cursor:pointer;padding:6px;display:flex}

/* ── forgot ── */
.forgot{text-align:right;margin:4px 0 16px}
.forgot button{font-family:'Inter',sans-serif;font-size:.7rem;color:rgba(255,255,255,.1);border:none;background:none;cursor:pointer;padding:4px 0;transition:color .15s}
.forgot button:hover{color:#14b8a6}

/* ── CTA row ── */
.cta-row{display:flex;gap:10px;margin-bottom:16px}
.cta-row .login{flex:1;padding:14px;border:none;border-radius:10px;background:#14b8a6;color:#0a0e1a;font-size:.875rem;font-weight:600;font-family:'Inter',sans-serif;cursor:pointer;transition:background .15s;letter-spacing:.005em}
.cta-row .login:hover{background:#0d9488}
.cta-row .register{flex:1;padding:14px;border:1px solid rgba(255,255,255,.08);border-radius:10px;background:transparent;color:rgba(255,255,255,.4);font-size:.875rem;font-weight:500;font-family:'Inter',sans-serif;cursor:pointer;transition:all .15s}
.cta-row .register:hover{background:rgba(255,255,255,.03);border-color:rgba(20,184,166,.2);color:#14b8a6}

/* ── bottom ── */
.bottom{text-align:center;padding:4px 0}
.bottom .skip{font-family:'Inter',sans-serif;font-size:.6rem;color:rgba(255,255,255,.05);border:none;background:none;cursor:pointer;padding:8px;transition:color .15s}
.bottom .skip:hover{color:rgba(255,255,255,.15)}
</style>
</head>
<body>
<div class="phone">
  <div class="notch"></div>
  <div class="status"><span>9:41</span><span>🔋 96%</span></div>
  <div class="screen">

    <div class="brand">
      <div class="mark">剧</div>
      <span class="name">英语剧场</span>
      <div class="flex"></div>
      <button class="skip">先逛逛 →</button>
    </div>

    <!-- quote: the centerpiece -->
    <div class="quote">
      <blockquote>“The night is dark and full of terrors.”</blockquote>
      <div class="cite">Melisandre · <em>Game of Thrones</em></div>
    </div>

    <!-- stats: from DB -->
    <div class="stats">
      <div class="item"><div class="num">2</div><div class="lbl">剧</div></div>
      <div class="item"><div class="num">17</div><div class="lbl">剧集</div></div>
      <div class="item"><div class="num">10K+</div><div class="lbl">台词</div></div>
    </div>

    <!-- form -->
    <div class="field">
      <label>邮箱 / 手机号</label>
      <div class="input-wrap">
        <span class="ico">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M16 8v5a3 3 0 0 0 6 0v-1a10 10 0 1 0-3.92 7.94"/></svg>
        </span>
        <input type="text" placeholder="邮箱或手机号">
      </div>
    </div>
    <div class="field">
      <label>密码</label>
      <div class="input-wrap">
        <span class="ico">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
        </span>
        <input type="password" placeholder="输入密码">
        <button class="eye">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
      </div>
    </div>

    <div class="forgot">
      <button>忘记密码？</button>
    </div>

    <div class="cta-row">
      <button class="login">登录</button>
      <button class="register">注册</button>
    </div>

    <div class="bottom">
      <button class="skip">先逛逛 · 不登录</button>
    </div>

  </div>
</div>
</body>
</html>
