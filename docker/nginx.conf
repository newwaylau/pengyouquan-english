# 英语剧场 — Nginx 配置模板
# 部署时请将 server_name 替换为实际域名

# ----- Gzip 压缩（后备压缩，brotli 优先）-----
gzip on;
gzip_min_length 256;
gzip_types
  text/plain
  text/css
  text/javascript
  application/javascript
  application/x-javascript
  application/json
  application/xml
  image/svg+xml;

# ----- 缓存配置 -----
# 音频缓存（原音 + TTS）
proxy_cache_path /var/cache/nginx/audio levels=1:2 keys_zone=audio_cache:50m max_size=2g inactive=30d use_temp_path=off;

# API 响应缓存（用于部分 GET 接口）
proxy_cache_path /var/cache/nginx/api levels=1:2 keys_zone=api_cache:50m max_size=1g inactive=60m use_temp_path=off;

# 日志格式（加后端响应时间，便于性能分析）
log_format upstream '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" '
                    'upstream=$upstream_response_time request=$request_time '
                    'cache=$upstream_cache_status';

access_log /var/log/nginx/access.log upstream;

# ----- Upstream 后端（支持 HTTP keepalive）-----
upstream backend_cluster {
    server backend:8080;
    keepalive 32;
}

server {
    listen 80;
    server_name pengyouquan.example.com;
    client_max_body_size 50m;

    # ----- 前端静态文件（SPA）-----
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # ----- 原音音频（剧集原声片段）-----
    location /api/audio/ {
        proxy_cache audio_cache;
        proxy_cache_key "$scheme$host$uri";
        proxy_cache_valid 200 7d;
        proxy_cache_valid 404 1m;
        add_header X-Cache-Status $upstream_cache_status;
        proxy_pass http://backend_cluster;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 60s;
    }

    # ----- TTS（AI 合成语音）-----
    location /api/tts {
        proxy_cache audio_cache;
        proxy_cache_key "$scheme$host$uri$is_args$args";
        proxy_cache_valid 200 7d;
        proxy_cache_lock on;
        add_header X-Cache-Status $upstream_cache_status;
        proxy_pass http://backend_cluster;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 120s;
    }

    # ----- WebSocket / SockJS 端点（转发到后端 STOMP）-----
    location /ws {
        proxy_pass http://backend_cluster;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ----- 后端 API（非音频接口）-----
    location /api/ {
        proxy_cache api_cache;
        proxy_cache_key "$scheme$host$uri$is_args$args";
        proxy_cache_valid 200 1m;
        proxy_cache_valid 404 1m;
        proxy_cache_methods GET;
        add_header X-Cache-Status $upstream_cache_status;
        proxy_pass http://backend_cluster;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }
}
