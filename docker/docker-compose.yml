# 朋友圈英语 - 完整部署 Docker Compose
# 启动：docker compose -f docker/docker-compose.yml up -d
# 停止：docker compose -f docker/docker-compose.yml down

services:
  mysql:
    image: mysql:8.0
    container_name: pengyouquan-mysql
    environment:
      MYSQL_ROOT_PASSWORD: pengyouquan123
      MYSQL_DATABASE: pengyouquan_english
      MYSQL_CHARACTER_SET_SERVER: utf8mb4
      MYSQL_COLLATION_SERVER: utf8mb4_unicode_ci
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: pengyouquan-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    container_name: pengyouquan-backend
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/pengyouquan_english?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=UTF-8
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: pengyouquan123
      SPRING_DATA_REDIS_HOST: redis
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
    container_name: pengyouquan-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  mysql-data:
  redis-data:
