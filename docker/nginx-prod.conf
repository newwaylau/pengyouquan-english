# 英语剧场 — PROD Nginx 配置（后端 8082 端口）
proxy_cache_path /var/cache/nginx/audio levels=1:2 keys_zone=audio_cache:50m max_size=2g inactive=30d use_temp_path=off;
proxy_cache_path /var/cache/nginx/api levels=1:2 keys_zone=api_cache:50m max_size=1g inactive=60m use_temp_path=off;

log_format upstream '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" '
                    'upstream=$upstream_response_time request=$request_time '
                    'cache=$upstream_cache_status';

access_log /var/log/nginx/access.log upstream;

server {
    listen 80;
    server_name english.pengyouquan.top;
    client_max_body_size 50m;

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    location /api/audio/ {
        proxy_cache audio_cache;
        proxy_cache_key "$scheme$host$uri";
        proxy_cache_valid 200 7d;
        proxy_cache_valid 404 1m;
        add_header X-Cache-Status $upstream_cache_status;
        proxy_pass http://172.17.0.1:8082;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 60s;
    }

    location /api/tts {
        proxy_cache audio_cache;
        proxy_cache_key "$scheme$host$uri$is_args$args";
        proxy_cache_valid 200 7d;
        proxy_cache_lock on;
        add_header X-Cache-Status $upstream_cache_status;
        proxy_pass http://172.17.0.1:8082;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 120s;
    }

    location /api/ {
        proxy_cache api_cache;
        proxy_cache_key "$scheme$host$uri$is_args$args";
        proxy_cache_valid 200 1m;
        proxy_cache_valid 404 1m;
        proxy_cache_methods GET;
        add_header X-Cache-Status $upstream_cache_status;
        proxy_pass http://172.17.0.1:8082;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }
}
